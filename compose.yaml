include:
  - path: proxy.yaml

name: shvirtd-project

services:

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}

    volumes:
      - db_data:/var/lib/mysql
    networks:
      backend:
        ipv4_address: 172.20.0.10

  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: web_app:latest
    restart: on-failure

    expose:
      - 5000

    environment:
      DB_HOST: 172.20.0.10
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      LOG_TABLE_NAME: api_logs_v2

    depends_on:
      - db
    networks:
      backend:
        ipv4_address: 172.20.0.5

volumes:
  db_data: {}